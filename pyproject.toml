[project]
name = "agentiam"
version = "0.1.0"
description = "Identity, authorization, and spend control for AI agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "agentiam-controlplane",
    "agentiam-core",
    "agentiam-demo",
    "agentiam-pep",
    "agentiam-sdk",
]

# The workspace root is not itself a distributable package.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
agentiam-controlplane = { workspace = true }
agentiam-core = { workspace = true }
agentiam-demo = { workspace = true }
agentiam-pep = { workspace = true }
agentiam-sdk = { workspace = true }

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-benchmark>=5.1",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    # `authlib` ships no `py.typed` marker (T-043, ADR-046) — stubs only, mypy-time.
    "types-authlib>=1.7",
    # `keycloak` extra pulls `python-keycloak`, required by
    # `testcontainers.community.keycloak` (T-043) — importing that module without it is a
    # `ModuleNotFoundError`, not a lazy-optional feature.
    "testcontainers[postgres,keycloak]>=4.8",
    # Validating the observability infra's YAML (T-049) — already resolved transitively via
    # `uvicorn[standard]`, pinned here directly because tests import it, not just uvicorn.
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    "py-spy>=0.4.2",
    # T-054 — security scanning + SBOM. All four run in CI (`.github/workflows/ci.yml`
    # `security-scan` job). Configured in `[tool.bandit]` below; results and waivers in
    # `docs/evidence/security-scan.md`. The SBOM is regenerated from the resolved venv by
    # `scripts/generate_sbom.py` and committed to `docs/evidence/sbom.json`.
    "bandit>=1.7",
    "pip-audit>=2.7",
    "cyclonedx-bom>=6",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "tests", "scripts"]
# Ruff formats Python code blocks inside Markdown. The code in docs/ is illustrative
# specification, with alignment chosen for readability — it is not compiled and must not
# be rewritten to satisfy a formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "A",    # flake8-builtins
    "RUF",  # ruff-specific
    "D",    # pydocstyle — ENGINEERING-RULES: docstrings on all public functions
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert, and need no module/class docstring ceremony beyond the module one.
# ANN401: canonical-serialization properties are *about* arbitrary input, so `Any` is the
# honest annotation rather than a gap.
"tests/**" = ["S101", "ANN401", "D100", "D101", "D102", "D103", "D104"]
"scripts/**" = ["S101"]
# S105 flags `TOKEN_EXPIRED = "TOKEN_EXPIRED"` as a hardcoded password because the name
# contains "TOKEN". These are reason codes from PLAN.md §6.9, not secrets.
"packages/agentiam-core/src/agentiam_core/errors.py" = ["S105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = [
    "scripts",
    "agentiam_controlplane",
    "agentiam_core",
    "agentiam_demo",
    "agentiam_pep",
    "agentiam_sdk",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
disallow_any_unimported = true
files = ["packages", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["tests.*"]
# Test bodies stay strict, but pytest fixtures are noisy about decorator types.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# `fastbloom-rs` (T-039, ADR-044) is a Rust extension with no stub package and no
# `py.typed` marker. `agentiam_pep.revocation` narrows every value it touches to
# `CountingBloomFilter`/plain `bool`/`str` immediately, so the untyped surface does not
# leak past that one module.
module = ["fastbloom_rs.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `tests` is an importable package so shared fixtures and hypothesis strategies can be
# imported by path (`tests.property.strategies`) rather than by sys.path accident.
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: requires Postgres and Redis to be running",
    "e2e: requires the full stack",
    "security: red-team / adversarial test (PLAN.md §12)",
    "chaos: fault-injection test (PLAN.md §13)",
    "perf: benchmark or load test (PLAN.md §13.1)",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["packages"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# ---------------------------------------------------------------------------
# bandit — T-054
# ---------------------------------------------------------------------------
# `bandit -c pyproject.toml -r packages scripts` matches what CI runs. Every skip is
# the twin of a ruff `S`-rule waiver documented elsewhere; drop it here if the ruff
# waiver drops there. `# nosec Bxxx - reason` still applies inline where the twin is
# per-line rather than global (see `scripts/run_load_test.py`).
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist", "node_modules"]
skips = [
    # B101 (assert_used) — every assert in `packages/` is a load-bearing invariant
    # annotated `# noqa: S101` for ruff. The codebase never runs under `python -O`,
    # so the "assertions get stripped" concern does not apply.
    "B101",
    # B105 / B106 (hardcoded_password_string / hardcoded_password_funcarg) —
    # false positives on the closed `ReasonCode` enum (spec 09 §11) and on the
    # local-testcontainer Postgres password in `run_load_test.py`. Both already have
    # `# noqa: S105`/`# noqa: S106` for ruff.
    "B105",
    "B106",
]
