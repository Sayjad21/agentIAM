# Install with: make install   (or: uv run pre-commit install)
#
# These hooks are the same checks CI runs, moved earlier. If a hook is slowing you down,
# fix the cause — do not skip it with --no-verify.

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        pass_filenames: false
        args: ["--config-file=pyproject.toml"]
        additional_dependencies:
          - pydantic>=2.9
          - pytest>=8.3

  # Secret scanning. NFR-5 forbids plaintext secrets anywhere, including history.
  # T-054 pins `.gitleaks.toml` as the shared config so pre-commit and CI apply the
  # same waivers.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.1
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml"]
