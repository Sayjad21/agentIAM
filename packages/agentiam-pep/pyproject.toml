[project]
name = "agentiam-pep"
version = "0.1.0"
description = "AgentIAM Policy Enforcement Point: the hot-path gateway."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "agentiam-core",
    "fastapi>=0.115",
    "httpx>=0.28",
    # API only, deliberately. Without an SDK installed the tracer is a no-op, so T-022 can
    # emit spans now and T-049 wires the collector in M6 (ADR-001, infrastructure per-ticket).
    "opentelemetry-api>=1.30",
    "prometheus-client>=0.21",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentiam_pep"]
