[project]
name = "agentiam-pep"
version = "0.1.0"
description = "AgentIAM Policy Enforcement Point: the hot-path gateway."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "agentiam-core",
    # Ed25519 for policy-bundle signatures (T-025). Rule 1 forbids writing crypto,
    # so this is not optional; PyCA is the conventional, audited choice and ships
    # cp312 wheels for win_amd64 and manylinux x86_64.
    "cryptography>=44",
    # Cedar's official Rust engine via PyO3. cp312 wheels exist for win_amd64 and
    # manylinux x86_64, so neither the dev host nor CI builds from source.
    "cedarpy>=4.8",
    "fastapi>=0.115",
    "httpx>=0.28",
    # T-022 added the API only, deliberately: without an SDK the tracer is a no-op, so
    # spans could be measured (5.58 us, `emitter.py`) before anything paid to export them.
    # T-049 adds the SDK + an OTLP/HTTP exporter, wired through `tracing.py` and only
    # activated when `AGENTIAM_PEP_OTEL_EXPORTER_ENDPOINT` is set (ADR-047).
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "prometheus-client>=0.21",
    "uvicorn[standard]>=0.32",
    # Subscribing to the `agentiam:revocations` pub/sub channel — spec 07 §5.1, ADR-042.
    # Never imported from the `decide()` hot path; only the background consumer touches it.
    "redis>=5.0",
    # Rust-backed counting Bloom filter in front of the exact revocation set — T-039,
    # ADR-044. Same "official Rust engine via PyO3" pattern already used for `cedarpy`
    # above; a pure-Python counting Bloom filter (`pyprobables`) measured ~370x slower
    # per lookup than a plain `set` at this sizing, which would make it a net loss rather
    # than a performance layer (ADR-044).
    "fastbloom-rs>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentiam_pep"]
