# AgentIAM — the demo stack. T-056 Part 2.
#
# An OVERLAY on top of docker-compose.yml, not a standalone file — the same pattern
# `docker-compose.observability.yml` uses for the same reason: postgres/redis/keycloak
# stay defined once, in one place, rather than duplicated. Bring up the whole demo with:
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --wait
#   # or: make demo-up
#
# **Why five extra services for two application processes.** `bootstrap` and `migrate`
# are one-shot: neither the control plane nor the PEP can start without real credentials
# (a root keypair, a signed policy bundle — ADR-056) or a migrated schema, and nothing
# in this repository can invent either at image-build time. Both gate the two app
# services via `service_completed_successfully`, so `docker compose up --wait` only
# reports healthy once the whole chain — not just the containers starting — has actually
# succeeded. `tools` is the M4 stub upstream (`agentiam_demo.tools`) so there is
# something for the PEP to proxy to.
#
# **Secrets cross container boundaries as files, not environment variables.** `bootstrap`
# writes into the `demo-secrets` named volume; `controlplane` and `pep` mount it read-only
# and read the root private key / policy bundle / signature / public keys from it at
# startup via a small shell wrapper — `ControlPlaneSettings.from_env()` and
# `pep_service.ServiceSettings.from_env()` both read plain environment variables, not
# `_FILE`-suffixed indirection, so the wrapper is what bridges the two without changing
# either settings class for a demo-only concern.
#
# **Ollama is a separate, opt-in profile** (`--profile llm`), not part of the default
# bring-up: `AGENTIAM_LLM_BACKEND` defaults to hosted inference (ADR-040), a model pull is
# several GB, and NFR-8's 90 s budget is measured against the stack an operator actually
# needs to run the enforcement demo — the compiler beat (5) works identically against the
# hosted default without it. Bring it up explicitly when demonstrating the local-inference
# fallback (`DEMO.md` F-1):
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile llm up -d --wait

services:
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentiam-bootstrap
    volumes:
      - demo-secrets:/secrets
    command: ["python", "scripts/bootstrap_demo_secrets.py", "--out", "/secrets"]
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentiam-migrate
    working_dir: /app/packages/agentiam-controlplane
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentiam}:${POSTGRES_PASSWORD:-agentiam}@postgres:5432/${POSTGRES_DB:-agentiam}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  # T-057. Between `migrate` (schema) and `pep` (which binds its mandate at boot and primes
  # its lease pool during startup, so the budget row has to exist first). Same one-shot
  # shape as `bootstrap`, and idempotent for the same reason: compose re-runs these on
  # every `up`.
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentiam-seed
    volumes:
      - demo-secrets:/secrets
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentiam}:${POSTGRES_PASSWORD:-agentiam}@postgres:5432/${POSTGRES_DB:-agentiam}
    command: ["python", "scripts/seed_demo.py", "--out", "/secrets"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  tools:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentiam-tools
    command: ["python", "scripts/serve_tools.py", "--host", "0.0.0.0", "--port", "8081"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  controlplane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentiam-controlplane
    volumes:
      - demo-secrets:/secrets:ro
    ports:
      - "${CONTROLPLANE_PORT:-8000}:8000"
    environment:
      AGENTIAM_CONTROLPLANE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentiam}:${POSTGRES_PASSWORD:-agentiam}@postgres:5432/${POSTGRES_DB:-agentiam}
      AGENTIAM_CONTROLPLANE_REDIS_URL: redis://redis:6379/0
      AGENTIAM_CONTROLPLANE_APPROVERS: ${AGENTIAM_CONTROLPLANE_APPROVERS:-kc:11111111-1111-1111-1111-111111111111,kc:22222222-2222-2222-2222-222222222222}
      AGENTIAM_CONTROLPLANE_SESSION_SECRET_KEY: ${AGENTIAM_CONTROLPLANE_SESSION_SECRET_KEY:-dev-change-me-session-secret}
      # Authenticates `POST /v1/revocations` as the named approver, presented as
      # `Authorization: Bearer <secret>`. Revocation is incident response and has to work
      # from a script, so it cannot depend on the browser login that the next comment
      # explains is unwired here. The value below is a known dev default, exactly like the
      # session key above: set a real secret for anything reachable beyond localhost.
      AGENTIAM_CONTROLPLANE_OPERATOR_TOKENS: ${AGENTIAM_CONTROLPLANE_OPERATOR_TOKENS:-kc:11111111-1111-1111-1111-111111111111=dev-change-me-operator-token}
      # The NL->Cedar compiler's backend, forwarded from the host `.env` that `llm.py`'s
      # `load_dotenv()` already reads outside Docker. Without these three the container
      # cannot see the key, `client_from_env()` falls through its whole selection chain to
      # the local Ollama fallback, and `POST /policy/compile` answers "Ollama network
      # error" on a machine where Gemini works perfectly from the shell — measured, and
      # mistaken for the documented opt-in behaviour until someone asked why.
      # Empty is still a legitimate configuration: the chain then ends at Ollama on purpose.
      AGENTIAM_LLM_BACKEND: ${AGENTIAM_LLM_BACKEND:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # OIDC is deliberately not wired here: it needs the console's redirect URI reachable
      # from a browser on the host, which depends on how the demo is being viewed. Set
      # AGENTIAM_CONTROLPLANE_OIDC_ISSUER/CLIENT_ID/CLIENT_SECRET to enable login; doing so
      # also switches the passwordless sign-in below off, since a real issuer always wins.
      #
      # Until then DEMO_LOGIN stands in for it. Approve and deny take the acting approver
      # from the session and never from the request body (ADR-046), and with no login at all
      # nothing ever put a principal into that session -- so the queue rendered, validated
      # its narrowing live, and answered every approval with 401. It is the one screen that
      # could not complete its own workflow.
      #
      # This checks no credential. It is off by default in code, on here because this file
      # is the demo stack, and /readyz reports it as `demo_login` separately from `auth` so
      # a probe cannot mistake one for the other. Do not set it anywhere reachable.
      AGENTIAM_CONTROLPLANE_DEMO_LOGIN: ${AGENTIAM_CONTROLPLANE_DEMO_LOGIN:-true}
      # `kc:<sub>=<display name>|<job title>`, comma separated. The first two ids match
      # APPROVERS above; the third deliberately does not, so the demo can show the allowlist
      # refusing an approval with 403 rather than only ever succeeding.
      AGENTIAM_CONTROLPLANE_DEMO_PERSONAS: ${AGENTIAM_CONTROLPLANE_DEMO_PERSONAS:-kc:11111111-1111-1111-1111-111111111111=Farhana Rahman|Finance Manager,kc:22222222-2222-2222-2222-222222222222=Tanvir Ahmed|Chief Financial Officer,kc:33333333-3333-3333-3333-333333333333=Nusrat Jahan|Procurement Analyst}
    # The public half is read too, not derived: biscuit's `PrivateKey` exposes no
    # `public_key()` (measured against biscuit-python 0.4.0), and the console needs it to
    # verify a parent token before attenuating it when an operator spawns a sub-agent.
    command: >
      sh -c "export AGENTIAM_CONTROLPLANE_ROOT_PRIVATE_KEY=$$(cat /secrets/root_private_key.hex) &&
             export AGENTIAM_CONTROLPLANE_ROOT_PUBLIC_KEY=$$(cat /secrets/root_public_key.hex) &&
             uvicorn agentiam_controlplane.app:create_app_from_env --factory --host 0.0.0.0 --port 8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  pep:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentiam-pep
    volumes:
      - demo-secrets:/secrets:ro
    # Host-side default is 8082, not 8080: `keycloak` above already claims host 8080,
    # and both defaulting to 8080 is a real collision, not a hypothetical one — measured
    # in CI (`docker compose up` failed with "Bind for 0.0.0.0:8080 failed: port is
    # already allocated"). The container's own internal port stays 8080, unaffected.
    ports:
      - "${PEP_PORT:-8082}:8080"
    environment:
      AGENTIAM_PEP_UPSTREAM_BASE_URL: http://tools:8081
      AGENTIAM_PEP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentiam}:${POSTGRES_PASSWORD:-agentiam}@postgres:5432/${POSTGRES_DB:-agentiam}
      AGENTIAM_PEP_REDIS_URL: redis://redis:6379/0
      AGENTIAM_PEP_CONTROL_PLANE_URL: http://controlplane:8000
      # The PEP is scoped to exactly one mandate (ADR-056, STATUS gap 25), and it binds it
      # at boot — so the id has to be known before `seed` runs, which is why
      # `scripts/seed_demo.DEMO_MANDATE_ID` is a fixed constant rather than a fresh uuid.
      # The two must agree; `tests/unit/test_demo_compose.py` checks that they do.
      AGENTIAM_PEP_MANDATE_ID: ${AGENTIAM_PEP_MANDATE_ID:-d0d0d0d0-0000-4000-8000-000000000001}
      AGENTIAM_PEP_ID: pep-1
      AGENTIAM_PEP_POLICY_BUNDLE_PATH: /secrets/policy_bundle.json
      AGENTIAM_PEP_POLICY_BUNDLE_SIG_PATH: /secrets/policy_bundle.sig
      AGENTIAM_PEP_ROUTES_PATH: /secrets/routes.json
      # What the organization says each agent is, keyed by delegation path. Without it
      # every agent gets `default_role` and the bundle's `role != "senior"` forbid is
      # always-on or always-off — TODO item 29. `scripts/bootstrap_demo_secrets.py`
      # writes the file; `tests/unit/test_demo_compose.py` checks the two agree.
      AGENTIAM_PEP_ROLE_ASSIGNMENTS_PATH: /secrets/role_assignments.json
      AGENTIAM_PEP_OLLAMA_URL: ${AGENTIAM_PEP_OLLAMA_URL:-}
      # How long an escalation the PEP opens stays pending. The pipeline's own default is
      # 15 minutes, which expires between `make demo-seed` and anyone opening the queue.
      AGENTIAM_PEP_ESCALATION_TTL_S: ${AGENTIAM_PEP_ESCALATION_TTL_S:-28800}
    command: >
      sh -c "export AGENTIAM_PEP_ROOT_PUBLIC_KEYS=$$(cat /secrets/root_public_key.hex) &&
             export AGENTIAM_PEP_POLICY_PUBLIC_KEY=$$(cat /secrets/policy_public_key.hex) &&
             python scripts/pep_service.py --host 0.0.0.0 --port 8080"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      # Without this the PEP primes before the pool row exists, logs the warning, and
      # refuses every budgeted request until a top-up — which is exactly the empty-console
      # state T-057 exists to end.
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      tools:
        condition: service_healthy
      controlplane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  # Opt-in — see the file header. `docker compose --profile llm up`.
  ollama:
    image: ollama/ollama:0.5.4
    container_name: agentiam-ollama
    profiles: ["llm"]
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  demo-secrets:
  ollama-data:
