[project]
name = "agentiam-pep"
version = "0.1.0"
description = "AgentIAM Policy Enforcement Point: the hot-path gateway."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "agentiam-core",
    # Ed25519 for policy-bundle signatures (T-025). Rule 1 forbids writing crypto,
    # so this is not optional; PyCA is the conventional, audited choice and ships
    # cp312 wheels for win_amd64 and manylinux x86_64.
    "cryptography>=44",
    # Cedar's official Rust engine via PyO3. cp312 wheels exist for win_amd64 and
    # manylinux x86_64, so neither the dev host nor CI builds from source.
    "cedarpy>=4.8",
    "fastapi>=0.115",
    "httpx>=0.28",
    # API only, deliberately. Without an SDK installed the tracer is a no-op, so T-022 can
    # emit spans now and T-049 wires the collector in M6 (ADR-001, infrastructure per-ticket).
    "opentelemetry-api>=1.30",
    "prometheus-client>=0.21",
    "uvicorn[standard]>=0.32",
    # Subscribing to the `agentiam:revocations` pub/sub channel — spec 07 §5.1, ADR-042.
    # Never imported from the `decide()` hot path; only the background consumer touches it.
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentiam_pep"]
