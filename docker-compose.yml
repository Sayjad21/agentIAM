# AgentIAM — development infrastructure.
#
# Services are introduced per-ticket rather than all at once (ADR-001). Postgres, Redis
# and now Keycloak (T-043, ADR-046). Ollama and the observability stack (M6) still arrive
# via their own compose files.
#
#   docker compose up -d --wait     # or: make up
#
# NFR-8 (full-stack cold start under 90 s) is measured in M6/M7, once the stack is
# complete. Measuring it against a two-service subset would be measuring nothing.

name: agentiam

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentiam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentiam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentiam}
      POSTGRES_DB: ${POSTGRES_DB:-agentiam}
      # Money is NUMERIC(20,4); keep the locale deterministic so ordering and
      # formatting never depend on the host.
      LANG: C
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentiam} -d ${POSTGRES_DB:-agentiam}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: agentiam-redis
    restart: unless-stopped
    # Leases and revocation gossip live here. appendonly keeps a restart from silently
    # dropping revocation state during a demo (failure drill F-3).
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: agentiam-keycloak
    restart: unless-stopped
    # `sslRequired: none` lives in the realm import itself (deploy/keycloak/realm-export.json)
    # rather than here — dev has no TLS terminator (ADR-046). The demo user passwords in
    # that file are throwaway dev-only values for a container nothing depends on once torn
    # down; they are not secrets in the gitleaks sense.
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      # Two things here are load-bearing and neither is obvious, both found by running
      # this on Fedora rather than on Docker Desktop (T-056):
      #
      # 1. The destination filename must be `<realm>-realm.json`. Keycloak 26's
      #    DirImportProvider silently skips anything else — it still logs "Import
      #    finished successfully" while importing nothing, and `/realms/agentiam/...`
      #    then 404s. Measured both ways. `tests/unit/test_compose_config.py`
      #    cross-checks this name against the `realm` field inside the file.
      # 2. `z` is the SELinux shared label. Without it an enforcing host (Fedora, RHEL,
      #    CentOS) gives the container `Permission denied`, which Keycloak reports as
      #    `ERROR: directory not found` and then crash-loops, so `make up` never reaches
      #    healthy. Docker Desktop ignores the option, so this is the portable spelling
      #    rather than a Linux-only workaround.
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/agentiam-realm.json:ro,z
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      # Keycloak 26 splits health checks onto the management port (9000), same reasoning
      # `testcontainers.community.keycloak.KeycloakContainer._readiness_probe` uses — but
      # the management port is not published here, so probe from inside the container.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  postgres-data:
  redis-data:
  keycloak-data:
