name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: >
          uv run pytest
          -m "not integration and not e2e and not chaos and not perf"
          --cov --cov-report=term-missing --cov-report=xml

      # NFR-1 is a headline number (p99 < 1 ms for the pure decision) and `PLAN.md`
      # §17 R-2 makes it a trigger: over 2 ms by M8 means porting the module to Rust.
      # The `quality` job excludes the `perf` marker, so without this step the
      # benchmark that measures it would run nowhere.
      - name: Benchmarks (NFR-1)
        run: uv run pytest -m perf --benchmark-only

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  integration:
    name: Ledger against real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync

      # The `quality` job excludes these, so until now nothing ran them automatically.
      # They are the only tests that exercise `SELECT ... FOR UPDATE` serialization, the
      # 50-concurrent-acquire bound, and the LEDGER_COMMIT dedup race that ADR-017 exists
      # to prevent a future edit from reintroducing. A race test that runs only when
      # someone remembers to run it is a race test that will rot silently.
      #
      # No compose services needed: the fixtures use testcontainers, which starts its own
      # postgres:16-alpine per module against the runner's Docker daemon.
      - name: Integration tests
        run: uv run pytest -m integration -v

  e2e:
    name: End-to-end thin slice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync

      # `quality` excludes the `e2e` marker and so does every other job, so without this the
      # slice would run only when someone remembered to. That has happened twice in this
      # project already — the 45 integration tests nothing ran, and `make bench` pointing at
      # an empty directory — and both times it was found by accident.
      #
      # This is M4's exit gate: root token -> PEP -> stub tool -> budget spent -> denied on
      # exhaustion -> decision in the audit ledger. If it goes red, nothing after it matters.
      - name: End-to-end slice
        run: uv run pytest -m e2e -v

  purity:
    name: agentiam-core is I/O-free
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync

      # Run separately from the main suite so a purity violation is unmissable in the
      # checks list rather than buried in a long test log. PLAN.md §5.
      - name: Check core purity
        run: uv run pytest tests/unit/test_core_purity.py -v

  infrastructure:
    name: Compose reaches healthy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Acceptance criterion for T-001. Also the baseline for NFR-8, which is measured
      # against the complete stack in M6/M7 rather than this subset.
      - name: Bring up infrastructure, timed
        run: |
          start=$(date +%s)
          docker compose up -d --wait --wait-timeout 90
          elapsed=$(( $(date +%s) - start ))
          echo "Cold start: ${elapsed}s (T-001 budget: 90s)"
          echo "### Cold start: ${elapsed}s / 90s budget" >> "$GITHUB_STEP_SUMMARY"
          docker compose ps

      - name: Verify services answer
        run: |
          docker compose exec -T postgres pg_isready -U agentiam -d agentiam
          docker compose exec -T redis redis-cli ping

      - name: Tear down
        if: always()
        run: docker compose down -v
