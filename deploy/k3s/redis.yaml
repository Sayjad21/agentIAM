# Same image and appendonly setting as docker-compose.yml's redis service — leases and
# revocation gossip live here; appendonly keeps a pod restart from silently dropping
# revocation state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: agentiam
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
          ports:
            - containerPort: 6379
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
            # redis needs somewhere writable beyond `data` even with `--dir` unset
            # (defaults to the image's own working directory) — live-verified against
            # a real kind cluster with a real SET/GET, not just a healthy pod status.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: agentiam
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: agentiam
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
