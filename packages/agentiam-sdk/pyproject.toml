[project]
name = "agentiam-sdk"
version = "0.1.0"
description = "Client SDK for AgentIAM: attenuation, spend contexts, escalation."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "agentiam-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentiam_sdk"]
