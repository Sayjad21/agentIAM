[project]
name = "agentiam-demo"
version = "0.1.0"
description = "Reference procurement agent, stub tool servers, and scripted demo scenarios."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "agentiam-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentiam_demo"]
