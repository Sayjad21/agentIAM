name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Chaos runs nightly per PLAN.md §13. Every other job is gated off `schedule` by its
  # own `if:` only where it needs to be — the rest are cheap enough to run here too.
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: >
          uv run pytest
          -m "not integration and not e2e and not chaos and not perf"
          --cov --cov-report=term-missing --cov-report=xml

      # NFR-1 is a headline number (p99 < 1 ms for the pure decision) and `PLAN.md`
      # §17 R-2 makes it a trigger: over 2 ms by M8 means porting the module to Rust.
      # The `quality` job excludes the `perf` marker, so without this step the
      # benchmark that measures it would run nowhere.
      - name: Benchmarks (NFR-1)
        run: uv run pytest -m perf --benchmark-only

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  integration:
    name: Ledger against real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync

      # The `quality` job excludes these, so until now nothing ran them automatically.
      # They are the only tests that exercise `SELECT ... FOR UPDATE` serialization, the
      # 50-concurrent-acquire bound, and the LEDGER_COMMIT dedup race that ADR-017 exists
      # to prevent a future edit from reintroducing. A race test that runs only when
      # someone remembers to run it is a race test that will rot silently.
      #
      # No compose services needed: the fixtures use testcontainers, which starts its own
      # postgres:16-alpine per module against the runner's Docker daemon.
      - name: Integration tests
        run: uv run pytest -m integration -v

  e2e:
    name: End-to-end thin slice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync

      # `quality` excludes the `e2e` marker and so does every other job, so without this the
      # slice would run only when someone remembered to. That has happened twice in this
      # project already — the 45 integration tests nothing ran, and `make bench` pointing at
      # an empty directory — and both times it was found by accident.
      #
      # This is M4's exit gate: root token -> PEP -> stub tool -> budget spent -> denied on
      # exhaustion -> decision in the audit ledger. If it goes red, nothing after it matters.
      - name: End-to-end slice
        run: uv run pytest -m e2e -v

  chaos:
    name: Chaos scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Nightly and on demand, not on every push: `PLAN.md` §13 schedules chaos nightly, and
    # CH-1 alone holds Postgres down for 30 s. The whole suite measured 3m05s locally
    # against §13's 20-minute budget, so the timeout is slack, not an estimate.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync

      - name: Chaos scenarios
        run: uv run pytest -m chaos -v

      # The committed table must match the runs that produced it. `generate_chaos_results.py`
      # rewrites it from the JSON each scenario emits; `--check` fails if what is committed
      # differs, which catches both a hand-edited table and a stale one.
      - name: Results table matches the runs
        run: uv run python scripts/generate_chaos_results.py --check

      - name: Upload chaos results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-results
          path: docs/benchmarks/chaos/
          if-no-files-found: ignore

  purity:
    name: agentiam-core is I/O-free
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync

      # Run separately from the main suite so a purity violation is unmissable in the
      # checks list rather than buried in a long test log. PLAN.md §5.
      - name: Check core purity
        run: uv run pytest tests/unit/test_core_purity.py -v

  evidence-pack:
    name: Evidence pack matches its sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync

      # T-055. Needs no live infrastructure — it folds already-committed sources
      # (chaos/benchmark JSON, security-scan.md, threat-model.md, sbom.json), the same
      # `--check` pattern as chaos-results.md / performance.md / sbom.json. Its own test
      # suite runs in the `quality` job with everything else under `tests/unit/`; this
      # job is only the drift check against the committed HTML file.
      - name: Evidence pack up to date
        run: uv run python scripts/generate_evidence_pack.py --check

      - name: Upload evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-pack
          path: docs/evidence/evidence-pack.html
          if-no-files-found: ignore

  security-scan:
    name: Security scanning + SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs on every push, PR, and nightly cron. `PLAN.md` T-054 asks for all four
    # scanners `clean or waived`; waivers live in `docs/evidence/security-scan.md` and
    # in the per-tool config files (`pyproject.toml [tool.bandit]`, `.gitleaks.toml`,
    # `.trivyignore`). A dedicated job so a security finding is unmissable in the
    # checks list rather than buried in the main test log.
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs the whole history to scan every commit, not just HEAD.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync

      # bandit — Python-code static analysis. Config in `pyproject.toml`
      # `[tool.bandit]`; waivers are the ruff-`S`-rule twins already documented there
      # and inline `# nosec Bxxx` in `scripts/run_load_test.py`.
      - name: bandit
        run: uv run bandit -c pyproject.toml -r packages scripts

      # pip-audit — advisories against the resolved lock. Export `uv.lock` rather than
      # scan the venv so `--disable-pip` is honest and CI does not depend on network
      # calls from the installed environment.
      - name: pip-audit
        run: |
          uv export --no-emit-workspace --no-editable --format=requirements-txt > /tmp/requirements.txt
          uv run pip-audit --disable-pip -r /tmp/requirements.txt --strict

      # SBOM — regenerated and asserted identical to the committed file. Same `--check`
      # pattern the chaos results and performance benchmarks use, so a dependency bump
      # that alters the SBOM fails visibly rather than drifting.
      - name: SBOM up to date
        run: uv run python scripts/generate_sbom.py

      # gitleaks — history and staged/uncommitted scans. Config in `.gitleaks.toml`
      # names the two documented waivers (dev-only placeholders in `.env.example` and
      # the Keycloak realm export).
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      # trivy filesystem — CVE scan of the whole tree. Overlaps `pip-audit` on Python
      # deps intentionally: a CVE indexed in Aqua's DB but not PyPA's still fails here.
      # `--scanners misconfig,vuln,secret` runs the config and secret checks too, so
      # this one step covers `docker-compose.yml`, GitHub Actions workflow syntax, and
      # committed secret patterns as well as vulns. `.trivyignore` documents waivers.
      - name: trivy fs
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          scanners: vuln,misconfig,secret
          trivyignores: .trivyignore

      # Deterministic surface: the log secret-scanning test T-054 requires. Marked
      # `security`, and `make check` excludes that marker, so this job is where it
      # runs by default.
      - name: Log secret-scanning test
        run: uv run pytest tests/security/test_secret_scanning.py -v

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: docs/evidence/sbom.json
          if-no-files-found: ignore

  infrastructure:
    name: Compose reaches healthy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Acceptance criterion for T-001. Also the baseline for NFR-8, which is measured
      # against the complete stack in M6/M7 rather than this subset.
      - name: Bring up infrastructure, timed
        run: |
          start=$(date +%s)
          docker compose up -d --wait --wait-timeout 90
          elapsed=$(( $(date +%s) - start ))
          echo "Cold start: ${elapsed}s (T-001 budget: 90s)"
          echo "### Cold start: ${elapsed}s / 90s budget" >> "$GITHUB_STEP_SUMMARY"
          docker compose ps

      - name: Verify services answer
        run: |
          docker compose exec -T postgres pg_isready -U agentiam -d agentiam
          docker compose exec -T redis redis-cli ping

      - name: Tear down
        if: always()
        run: docker compose down -v

  demo-stack:
    name: Demo stack reaches healthy (NFR-8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # T-056. The `infrastructure` job above measures the three dev-infra services
      # (T-001's own criterion); this measures NFR-8 for real — the complete deployable
      # stack: postgres, redis, keycloak, the one-shot bootstrap/migrate jobs, the stub
      # tools upstream, the control plane, and the PEP. Ollama is excluded on purpose
      # (docker-compose.demo.yml's own header explains why: opt-in, several-GB model
      # pull, not needed for the enforcement demo).
      - name: Build the image
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml build

      - name: Bring up the full demo stack, timed
        run: |
          start=$(date +%s)
          docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --wait --wait-timeout 90
          elapsed=$(( $(date +%s) - start ))
          echo "Demo stack cold start: ${elapsed}s (NFR-8 budget: 90s)"
          echo "### Demo stack cold start: ${elapsed}s / 90s budget (NFR-8)" >> "$GITHUB_STEP_SUMMARY"
          docker compose -f docker-compose.yml -f docker-compose.demo.yml ps

      # The one-shot jobs report health as "completed successfully", so the wait above
      # already proves the credential bootstrap and the migration both ran for real.
      # This step is the actual authorization pipeline, end to end, through the built
      # image rather than through pytest: verify -> revocation -> policy -> lease.
      - name: The PEP enforces for real
        run: |
          curl -sf http://localhost:8000/readyz
          curl -sf http://localhost:8080/readyz | grep -q '"enforcing":true'
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/proxy/invoices/inv-1)
          test "$status" = "401"

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml down -v
