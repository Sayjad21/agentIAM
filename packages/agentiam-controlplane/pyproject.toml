[project]
name = "agentiam-controlplane"
version = "0.1.0"
description = "AgentIAM control plane: issuance, ledger, policy, revocation, audit, console."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "agentiam-core",
    "sqlalchemy>=2.0",
    # Ed25519 for policy-bundle signatures (T-025). Rule 1 forbids writing crypto,
    # so this is not optional; PyCA is the conventional, audited choice and ships
    # cp312 wheels for win_amd64 and manylinux x86_64.
    "cryptography>=44",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "cedarpy>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentiam_controlplane"]
