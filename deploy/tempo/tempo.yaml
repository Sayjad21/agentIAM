# Tempo — single-binary, local-disk storage. T-049, ADR-047.
#
# No S3/GCS backend: this is dev/demo infrastructure with one binary and one volume, the
# same footing as docker-compose.yml's Postgres/Redis (local disk, no managed backend).

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
