# Prometheus scrape config — T-049, ADR-047.
#
# Both targets are host processes (neither agentiam-controlplane nor agentiam-pep run as
# containers — docker-compose.yml has no service for either), reached via
# `host.docker.internal`. 8000/8010 are this file's own placeholder choice — no ticket has
# fixed a dev-run port for either app yet (checked: nothing in the repo pins one). Edit the
# targets below to match however you actually launch them; T-057's demo script is expected
# to settle this for good.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: agentiam-controlplane
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: agentiam-pep
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8010"]
